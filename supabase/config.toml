project_id = "carmisetas"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Sin registro publico: las dos cuentas se crean por seed o por invitacion.
# Esta es la llave correcta (GOTRUE_DISABLE_SIGNUP).
enable_signup = false

[auth.email]
# OJO: en el CLI, auth.email.enable_signup mapea a GOTRUE_EXTERNAL_EMAIL_ENABLED,
# que apaga el proveedor de correo ENTERO — nadie podria ni siquiera entrar.
# El registro publico ya queda cerrado con auth.enable_signup de arriba.
enable_signup = true
enable_confirmations = false
double_confirm_changes = true

[analytics]
enabled = false
